<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <meta
      name="description"
      content="GainOS — 海外增长机会操作系统：发现海外买家、判断匹配与时机、交付可行动的线索。"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F8FA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F16" />
    <meta name="apple-mobile-web-app-title" content="GainOS" />

    <!-- 图标:现代浏览器取 SVG(任意 DPI 清晰),其余回退 ICO / PNG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
