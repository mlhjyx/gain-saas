name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # 同一 PR 的新推送取消旧 run；main 的每个 push 各自一组、互不取代，
  # 否则连续合并时 GitHub 只保留一个排队 run，中间的 main 提交得不到验证
  # （2026-11-11 在 #154 的合并 run 上实际发生）。
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      web_e2e_needed: ${{ steps.scope.outputs.web_e2e_needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 路径分级（fail-safe）：
      # - docs_only=true：全部改动均为 *.md（含 docs/、deploy/*.md、README.md、AGENTS.md 等），跳过构建与 E2E，仅走密钥扫描与轻量校验。
      # - web_e2e_needed=true：改动涉及前端、共享包、合同、锁文件、Playwright 或 CI 编排时运行前端 E2E；纯 server 改动跳过 4 路 E2E。
      # - 非 PR 事件、拿不到 diff 或 diff 失败时一律全量（docs_only=false, web_e2e_needed=true）。
      - id: scope
        name: Detect docs-only and web E2E scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]] || [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "web_e2e_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths="$RUNNER_TEMP/changed-paths.txt"
          if ! git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "web_e2e_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          web_e2e_needed=false
          has_paths=false
          while IFS= read -r -d '' path; do
            has_paths=true
            case "$path" in
              *.md)
                ;;
              *)
                docs_only=false
                ;;
            esac
            case "$path" in
              apps/web/* | packages/vben/* | packages/shared/* | packages/engine-client/* | playwright.config.* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .github/workflows/ci.yml)
                web_e2e_needed=true
                ;;
            esac
          done < "$paths"
          if [[ "$has_paths" != "true" ]]; then
            docs_only=false
            web_e2e_needed=true
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "web_e2e_needed=${web_e2e_needed}" >> "$GITHUB_OUTPUT"

  # 密钥扫描：文档同样可能泄露凭据，因此不随代码门一起跳过。
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: build · test · contract
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification did not succeed
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.classify.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "::error::change classification did not succeed: $SCOPE_RESULT"
            exit 1
          fi

      - name: Docs-only fast path（无代码/合同变化）
        if: needs.classify.outputs.docs_only == 'true'
        run: |
          echo "docs only: build, tests, lint and contract gates are not applicable; the PR only touches Markdown files."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Action pins (40-hex SHA)
        run: node scripts/check-action-pins.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version: 22

      - name: Enable corepack (pnpm 11 per packageManager)
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          corepack enable
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        if: needs.classify.outputs.docs_only != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      # P6 零术语红线（设计 §4、计划 v1.5 §3.9）：用户可见面禁 run/ICP/canonical/plan_hash/裸 UUID/裸枚举。
      # 豁免仅限技术详情与运营台，且必须写明理由；负向用例随 pnpm test 一起跑。
      - name: Zero-jargon terminology lint
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm lint:terms

      # QW14：视图日期格式唯一口径（YYYY-MM-DD / YYYY-MM-DD HH:mm），禁止 toLocale 系列。
      - name: Date format lint
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm lint:date

      # 全新安装没有生成的 Prisma Client;server 的 tsc 依赖它的生成类型,先生成再构建。
      - name: Prisma generate (server client)
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm --filter @gain-saas/server db:generate

      - name: Build (shared → ops-pg → engine-client → server → web)
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm build

      - name: Test
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm test

      # SD7 铁律的 CI 落点（离线、确定性）：固定合同、锁文件哈希与生成类型三方一致。
      # 运行中的引擎只在本机/部署机用 pnpm gen:engine 对账，CI 不再依赖引擎实例。
      - name: Engine contract pin（offline）
        if: needs.classify.outputs.docs_only != 'true'
        run: node packages/engine-client/scripts/verify-pin.mjs

      - name: Engine client types must match the pinned contract
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          pnpm --filter @gain-saas/engine-client gen:types
          git diff --exit-code -- packages/engine-client/src/schema.d.ts || \
            (echo "::error::schema.d.ts 与固定合同不一致 —— 运行 pnpm gen:engine 并提交生成物" && exit 1)

      # 破坏性变更拦截：固定合同在 PR 中被更新时，对比 base 分支的合同。
      # 确需破坏 → PR 打 `engine-contract-breaking-approved` label（升级说明见 engine-client README）。
      - name: Fetch base engine contract（仅 PR）
        if: github.event_name == 'pull_request' && needs.classify.outputs.docs_only != 'true'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if git show "origin/$GITHUB_BASE_REF:packages/engine-client/src/openapi.json" > base-engine-openapi.json 2>/dev/null; then
            if cmp -s base-engine-openapi.json packages/engine-client/src/openapi.json; then
              echo "engine contract unchanged in this PR"
            else
              echo "ENGINE_CONTRACT_CHANGED=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: oasdiff engine contract breaking
        if: >-
          github.event_name == 'pull_request' &&
          env.ENGINE_CONTRACT_CHANGED == '1' &&
          !contains(github.event.pull_request.labels.*.name, 'engine-contract-breaking-approved')
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        env:
          OASDIFF_INTERNAL: "1"
        with:
          base: base-engine-openapi.json
          revision: packages/engine-client/src/openapi.json
          fail-on: ERR
          review: "false"

  # M2 步 14-3：Playwright 主链路（BFF mock，4 路分片并行 + pnpm/Chromium 缓存）。
  # 纯文档 PR 或仅改 server 的 PR 跳过，push 到 main 始终全量运行。
  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.web_e2e_needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm 11 per packageManager)
        run: |
          corepack enable
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Build shared + web (e2e 产物)
        run: |
          pnpm --filter @gain-saas/shared build
          pnpm --filter @vben/web-antd build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium (full on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps (on browser cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright shard ${{ matrix.shard }}/4
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 稳定汇聚检查名 `e2e`（供后续 Ruleset 纳管且不出现 skipped 死锁）。
  e2e:
    name: e2e
    needs: [classify, e2e-shard]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify e2e gate result
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WEB_E2E_NEEDED: ${{ needs.classify.outputs.web_e2e_needed }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::classify did not succeed: $CLASSIFY_RESULT"
            exit 1
          fi
          if [[ "$WEB_E2E_NEEDED" != "true" ]]; then
            echo "web_e2e_needed=false: skipping Playwright E2E for docs-only or server-only PR."
            exit 0
          fi
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "::error::one or more Playwright E2E shards failed: $SHARD_RESULT"
            exit 1
          fi
          echo "All 4 Playwright E2E shards passed."
