name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # 同一 PR 的新推送取消旧 run；main 的每个 push 各自一组、互不取代，
  # 否则连续合并时 GitHub 只保留一个排队 run，中间的 main 提交得不到验证
  # （2026-11-11 在 #154 的合并 run 上实际发生）。
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 快道仅接受普通 Markdown；证据、发布和治理输入走全量。
      # 空 diff、文件删除、非普通文件和未识别路径均走全量。
      - id: scope
        name: Detect docs-only pull requests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]] || [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" || "$(git rev-parse "${HEAD_SHA}^1")" != "$BASE_SHA" ]]; then
            echo "::error::PR checkout or merge base does not match the workflow event"
            exit 1
          fi
          paths="$RUNNER_TEMP/changed-paths.txt"
          if ! git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths" || [[ ! -s "$paths" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/evidence/* | docs/governance/* | docs/releases/*)
                docs_only=false
                break
                ;;
              docs/*.md | docs/*.markdown | README.md | AGENTS.md)
                if ! head_mode=$(git --literal-pathspecs ls-tree --format='%(objectmode)' "$HEAD_SHA" -- "$path") ||
                   ! base_mode=$(git --literal-pathspecs ls-tree --format='%(objectmode)' "$BASE_SHA" -- "$path") ||
                   [[ "$head_mode" != "100644" || ( -n "$base_mode" && "$base_mode" != "100644" ) ]]; then
                  docs_only=false
                  break
                fi
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < "$paths"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  # 密钥扫描：文档同样可能泄露凭据，因此不随代码门一起跳过。
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: build · test · contract
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification did not succeed
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.classify.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "::error::change classification did not succeed: $SCOPE_RESULT"
            exit 1
          fi

      - name: Docs-only fast path（无代码/合同变化）
        if: needs.classify.outputs.docs_only == 'true'
        run: |
          echo "docs only: the classifier verified ordinary Markdown; code and contract checks are not applicable."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Action pins (40-hex SHA)
        run: node scripts/check-action-pins.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm 11 per packageManager)
        if: needs.classify.outputs.docs_only != 'true'
        run: corepack enable

      - name: Install
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      # P6 零术语红线（设计 §4、计划 v1.5 §3.9）：用户可见面禁 run/ICP/canonical/plan_hash/裸 UUID/裸枚举。
      # 豁免仅限技术详情与运营台，且必须写明理由；负向用例随 pnpm test 一起跑。
      - name: Zero-jargon terminology lint
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm lint:terms

      # QW14：视图日期格式唯一口径（YYYY-MM-DD / YYYY-MM-DD HH:mm），禁止 toLocale 系列。
      - name: Date format lint
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm lint:date

      # 全新安装没有生成的 Prisma Client;server 的 tsc 依赖它的生成类型,先生成再构建。
      - name: Prisma generate (server client)
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm --filter @gain-saas/server db:generate

      - name: Build (shared → ops-pg → engine-client → server → web)
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm build

      - name: Test
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm test

      # SD7 铁律的 CI 落点（离线、确定性）：固定合同、锁文件哈希与生成类型三方一致。
      # 运行中的引擎只在本机/部署机用 pnpm gen:engine 对账，CI 不再依赖引擎实例。
      - name: Engine contract pin（offline）
        if: needs.classify.outputs.docs_only != 'true'
        run: node packages/engine-client/scripts/verify-pin.mjs

      - name: Engine client types must match the pinned contract
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          pnpm --filter @gain-saas/engine-client gen:types
          git diff --exit-code -- packages/engine-client/src/schema.d.ts || \
            (echo "::error::schema.d.ts 与固定合同不一致 —— 运行 pnpm gen:engine 并提交生成物" && exit 1)

      # 破坏性变更拦截：固定合同在 PR 中被更新时，对比 base 分支的合同。
      # 确需破坏 → PR 打 `engine-contract-breaking-approved` label（升级说明见 engine-client README）。
      - name: Fetch base engine contract（仅 PR）
        if: github.event_name == 'pull_request' && needs.classify.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "::error::Checkout does not match the PR merge commit"
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR base SHA"
            exit 1
          fi
          # The raw commit header also has the first parent in a shallow checkout.
          first_parent=$(git cat-file commit HEAD | awk 'NF == 0 { body = 1 } !body && $1 == "parent" && !seen { print $2; seen = 1 }')
          if [[ "$first_parent" != "$BASE_SHA" ]]; then
            echo "::error::PR merge first parent does not match the event base"
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git show "${BASE_SHA}:packages/engine-client/src/openapi.json" > base-engine-openapi.json; then
            echo "::error::Base engine contract unavailable"
            exit 1
          fi
          if cmp -s base-engine-openapi.json packages/engine-client/src/openapi.json; then
            echo "engine contract unchanged in this PR"
          else
            echo "ENGINE_CONTRACT_CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: oasdiff engine contract breaking
        if: >-
          github.event_name == 'pull_request' &&
          env.ENGINE_CONTRACT_CHANGED == '1' &&
          !contains(github.event.pull_request.labels.*.name, 'engine-contract-breaking-approved')
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        env:
          OASDIFF_INTERNAL: "1"
        with:
          base: base-engine-openapi.json
          revision: packages/engine-client/src/openapi.json
          fail-on: ERR
          review: "false"

  # M2 步 14-3：Playwright 主链路（BFF mock，不依赖引擎/数据库；本地已全绿）。
  # 纯文档 PR 不跑；若长期不稳定，按设计 D-14-c 降为每日夜跑（保留本 job，改 cron 触发）。
  e2e:
    name: e2e
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm 11 per packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared + web (e2e 产物)
        run: |
          pnpm --filter @gain-saas/shared build
          pnpm --filter @vben/web-antd build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright (main chain + zero-jargon + error copy)
        run: pnpm exec playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  merge-admission:
    name: merge admission
    needs: [classify, secret-scan, build-test, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject cancelled workflow
        if: ${{ cancelled() }}
        run: |
          echo "::error::Cancelled workflows cannot admit a merge"
          exit 1

      - name: Validate CI results
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
          E2E: ${{ needs.e2e.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY" != "success" || "$SECRET_SCAN" != "success" || "$BUILD_TEST" != "success" ]]; then
            echo "::error::Classification, secret scan and build checks must all succeed"
            exit 1
          fi
          if [[ "$DOCS_ONLY" != "true" && "$DOCS_ONLY" != "false" ]]; then
            echo "::error::Missing or unrecognized change classification"
            exit 1
          fi
          if [[ "$E2E" != "success" && ( "$DOCS_ONLY" != "true" || "$E2E" != "skipped" ) ]]; then
            echo "::error::E2E must succeed unless it was skipped for a verified docs-only change"
            exit 1
          fi
