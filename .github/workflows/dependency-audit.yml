name: Dependency audit

# L-2（2026-11-12）：生产依赖漏洞的持续可见性。
# 仓库 .npmrc 指向 npmmirror（没有 audit endpoint），因此显式使用官方 registry。
# registry 故障会让本任务红，属预期行为，不静默放过。
# 只审计生产依赖（--prod）；版本更新仍关闭，安全更新由 dependabot.yml 驱动。

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Production dependency audit
        run: >-
          pnpm audit --prod --audit-level=high
          --registry=https://registry.npmjs.org/
